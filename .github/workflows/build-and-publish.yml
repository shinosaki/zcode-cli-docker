name: build-and-publish

# Build the zcode CLI container from the pins in zcode-version.env, publish it
# under a build tag, smoke-test THE EXACT PUBLISHED DIGEST, sign it (keyless
# cosign), and only then add the release tags (version + latest).
#
# Triggers:
#   * push to main touching any pin/build input (this is how an approved
#     update PR becomes a published image — merging IS the human gate)
#   * manual dispatch (job-level guard: main branch only)
#
# Security posture:
#   * every action pinned to a full commit SHA (never a mutable tag)
#   * verify-pin.mjs runs BEFORE any pin value is loaded into the environment
#   * minimal GITHUB_TOKEN permissions, per job
#   * checkout with persist-credentials: false (no token in .git/config)
#   * no pull_request_target, no secrets in build args, no third-party actions
#   * egress allowlist via harden-runner (block mode)
#   * SBOM + provenance attestations embedded in the registry by buildx
#   * cosign keyless signing (OIDC) bound to the tested digest
#   * cancel-in-progress: false — a publish must never be killed between
#     push and sign

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "zcode-version.env"
      - "scripts/**"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Code, not data: where the source comes from is not PR-configurable.
  # Keep in sync with scripts/verify-pin.mjs and scripts/check-upstream-update.mjs.
  ZCODE_UPSTREAM_URL: https://github.com/zai-org/ZCode.git

jobs:
  build-and-publish:
    name: Build, publish, smoke-test, sign, tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via OIDC
    timeout-minutes: 60
    steps:
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            index.docker.io:443
            production.cloudfront.docker.com:443
            nodejs.org:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            npm.flatt.tech:443
            registry.npmjs.org:443
            deb.debian.org:80
            security.debian.org:80
            api.stepsecurity.io:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verification runs BEFORE the pin file is loaded into the environment,
      # so a malformed or manipulated zcode-version.env can never influence
      # anything (including this script's own execution).
      - name: Verify pins against live upstream (tag -> commit, formats)
        run: node scripts/verify-pin.mjs

      - name: Load pins into the job environment
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            key="${key%$'\r'}"
            case "${key}" in ''|\#*) continue ;; esac
            case "${key}" in
              *[!A-Z0-9_]*|*[a-z]*) echo "FATAL: unexpected key: ${key}" >&2; exit 1 ;;
            esac
            echo "${key}=${value%$'\r'}" >> "${GITHUB_ENV}"
          done < zcode-version.env
          # Defensive: the strict parser already forbids this, but never load
          # anything that could alter node's behaviour in this job.
          case ":${NODE_OPTIONS:-}:" in *"--require"*) echo "FATAL: NODE_OPTIONS rejected" >&2; exit 1 ;; esac

      - name: Compute image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single build+push, then verify/sign/retag the SAME digest. The bytes
      # that are smoke-tested are provably the bytes that get signed and
      # tagged (a rebuild after testing could not guarantee that).
      - name: Build and push (build tag, SBOM + provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NODE_IMAGE_TAG=${{ env.NODE_IMAGE_TAG }}
            NODE_IMAGE_DIGEST=${{ env.NODE_IMAGE_DIGEST }}
            ZCODE_TAG=${{ env.ZCODE_TAG }}
            ZCODE_VERSION=${{ env.ZCODE_VERSION }}
            ZCODE_COMMIT=${{ env.ZCODE_COMMIT }}
            ZCODE_UPSTREAM_URL=${{ env.ZCODE_UPSTREAM_URL }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            PNPM_INTEGRITY=${{ env.PNPM_INTEGRITY }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            MINIMUM_RELEASE_AGE_MINUTES=${{ env.MINIMUM_RELEASE_AGE_MINUTES }}

      - name: Smoke test the exact pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash scripts/smoke-test.sh "${IMAGE_NAME}@${DIGEST}" "${ZCODE_VERSION}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      # Server-side tag creation: no rebuild, same digest, signatures stay valid.
      # The assertion guards the invariant "release tags point at the signed
      # digest" forever (a mismatch would mean consumers could pull an unsigned
      # digest under a release tag).
      - name: Add release tags (version + latest) and assert digest identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${ZCODE_VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST}"
          TAGGED="$(docker buildx imagetools inspect "${IMAGE_NAME}:${ZCODE_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "${TAGGED}" = "${DIGEST}" ] || {
            echo "FATAL: release tag digest mismatch: ${TAGGED} != ${DIGEST}" >&2
            exit 1
          }
          echo "release tags verified against signed digest ${DIGEST}"

      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published ${IMAGE_NAME}"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| zcode version | \`${ZCODE_VERSION}\` |"
            echo "| upstream tag | \`${ZCODE_TAG}\` |"
            echo "| upstream commit | \`${ZCODE_COMMIT}\` |"
            echo "| image digest | \`${DIGEST}\` |"
            echo "| registry | \`${REGISTRY}\` |"
            echo ""
            echo "### Verify before pulling"
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo ""
            echo "Always reference the image by digest, not by mutable tag."
            echo "The build tag \`:ci-${GITHUB_SHA}\` is transient bookkeeping and can be deleted."
          } >> "${GITHUB_STEP_SUMMARY}"
